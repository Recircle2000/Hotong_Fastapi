services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs/fullchain.pem:/etc/ssl/certs/cert.pem
      - ./certs/privkey.pem:/etc/ssl/private/key.pem
      - ./frontend-admin/dist:/usr/share/nginx/html/admin-v2:ro
    depends_on:
      - api
    restart: always
    environment:
      TZ: Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      # FCM 서비스 계정 키(secrets/fcm-service-account.json)는 저장소에 올리지 않고 서버에만 둔다.
      - ./secrets:/run/secrets/hotong:ro
    restart: always
    environment:
      TZ: Asia/Seoul
      REDIS_HOST: redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: always
    environment:
      TZ: Asia/Seoul

volumes:
  redis-data: 
